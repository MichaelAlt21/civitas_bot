services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civitas}
      POSTGRES_DB: ${POSTGRES_DB:-civitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CIVITAS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  bot:
    profiles: [bot]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CIVITAS_DATABASE_URL: ${CIVITAS_COMPOSE_DATABASE_URL:-}
      CIVITAS_DISCORD_TOKEN: ${CIVITAS_DISCORD_TOKEN:-}
      CIVITAS_DISCORD_GUILD_ID: ${CIVITAS_DISCORD_GUILD_ID:-}
      CIVITAS_CITIZEN_ROLE_ID: ${CIVITAS_CITIZEN_ROLE_ID:-}
      CIVITAS_ALLOWED_USER_IDS: ${CIVITAS_ALLOWED_USER_IDS:-}
      CIVITAS_STARTER_GRANT: ${CIVITAS_STARTER_GRANT:-}
      CIVITAS_TREASURY_GENESIS: ${CIVITAS_TREASURY_GENESIS:-}
      CIVITAS_CURRENCY_SYMBOL: ${CIVITAS_CURRENCY_SYMBOL:-₵}
      CIVITAS_NPC_REVIEWER_IDS: ${CIVITAS_NPC_REVIEWER_IDS:-}
      CIVITAS_BUDGET_WEEKLY_LIMIT: ${CIVITAS_BUDGET_WEEKLY_LIMIT:-}
      CIVITAS_NPC_WEEKLY_LIMIT: ${CIVITAS_NPC_WEEKLY_LIMIT:-}
      CIVITAS_NPC_PERSONAL_WEEKLY_LIMIT: ${CIVITAS_NPC_PERSONAL_WEEKLY_LIMIT:-}
      CIVITAS_NPC_REWARD_MIN: ${CIVITAS_NPC_REWARD_MIN:-}
      CIVITAS_NPC_REWARD_MAX: ${CIVITAS_NPC_REWARD_MAX:-}
      CIVITAS_BUDGET_TIMEZONE: ${CIVITAS_BUDGET_TIMEZONE:-UTC}
      CIVITAS_NPC_COOLDOWN_MINUTES: ${CIVITAS_NPC_COOLDOWN_MINUTES:-0}
      CIVITAS_COMPANY_FEE: ${CIVITAS_COMPANY_FEE:-}
      CIVITAS_COMPANY_LIMIT: ${CIVITAS_COMPANY_LIMIT:-}
      CIVITAS_SALES_TAX_BP: ${CIVITAS_SALES_TAX_BP:-}
      CIVITAS_MARKET_ARBITER_IDS: ${CIVITAS_MARKET_ARBITER_IDS:-}
      CIVITAS_ASSET_ISSUER_IDS: ${CIVITAS_ASSET_ISSUER_IDS:-}
      CIVITAS_TREASURY_INITIATOR_IDS: ${CIVITAS_TREASURY_INITIATOR_IDS:-}
      CIVITAS_TREASURY_APPROVER_IDS: ${CIVITAS_TREASURY_APPROVER_IDS:-}
      CIVITAS_CONTRACT_WEEKLY_LIMIT: ${CIVITAS_CONTRACT_WEEKLY_LIMIT:-}

volumes:
  db_data:
