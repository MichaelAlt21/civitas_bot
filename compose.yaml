services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civitas}
      POSTGRES_DB: ${POSTGRES_DB:-civitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CIVITAS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  bot:
    profiles: [bot]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CIVITAS_DATABASE_URL: ${CIVITAS_COMPOSE_DATABASE_URL:-}
      CIVITAS_DISCORD_TOKEN: ${CIVITAS_DISCORD_TOKEN:-}
      CIVITAS_DISCORD_GUILD_ID: ${CIVITAS_DISCORD_GUILD_ID:-}
      CIVITAS_ALLOWED_USER_IDS: ${CIVITAS_ALLOWED_USER_IDS:-}

volumes:
  db_data:
