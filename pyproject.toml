[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "civitas-bot"
version = "1.0.0rc1"
description = "Civitas Discord bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "discord.py==2.7.1",
    "psycopg[binary]==3.3.3",
    "SQLAlchemy[asyncio]==2.0.55",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
